
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean temporary Python cache files.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.10-slim
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" \
          -type d -name __pycache__ -prune -exec rm -rf {} +
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests with nose.
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements.txt
        nosetests -v
